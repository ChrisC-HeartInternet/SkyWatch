# Skywatch tunables
# -----------------
# This file is generic and tracked in git. Personal and deployment values —
# location, LLM endpoint and models, ntfy topic, bind address — live in .env
# (copy .env.example) and always override anything here.
#
# You can still pin a location here instead of .env if you prefer:
# location:
#   name: Ambleside
#   latitude: 54.4287
#   longitude: -2.9613
#   timezone: Europe/London

# Local LLM served over an OpenAI-compatible API (Ollama, LM Studio, ...).
# Endpoint and model names normally come from .env; these are the fallbacks.
llm:
  base_url: http://localhost:11434/v1
  api_key: null                 # or ${ENV_VAR}; Ollama needs none
  model: qwen3:32b              # Primary: writes the briefing
  fast_model: qwen3:8b          # Cheap: formats alerts into JSON
  timeout_seconds: 600          # Large local models can be slow to first token
  temperature: 0.2              # Low: this is analysis, not creative writing
  # Generation cap. Reasoning models (qwen3 family) think before answering,
  # and some templates ignore think:false — the budget must cover thinking
  # AND the briefing, hence the headroom. Ollama context limits are a
  # non-issue here: qwen3:235b loads at its full 262k context.
  max_tokens: 12288
  # false sends Ollama's think:false on every call. Models whose template
  # honours it (qwen3.5) answer directly; older templates think anyway,
  # which max_tokens above absorbs.
  thinking: false

# Numerical weather prediction models to pull from Open-Meteo.
#
# IMPORTANT: horizons differ. At these defaults GFS reaches 16 days, ECMWF 15,
# ICON 7 and UKMO 7. Skywatch tracks how many models cover each day so that the
# panel shrinking from 4 to 2 is never mistaken for the models agreeing.
models:
  deterministic:
    - ecmwf_ifs025
    - gfs_seamless
    - icon_seamless
    - ukmo_seamless
  # Ensemble members per model (verified): ecmwf_ifs025 50, gfs025 30,
  # icon_eu 39, icon_global 39, ukmo_global_ensemble_20km 17.
  ensemble:
    - ecmwf_ifs025
    - gfs025

# How far to fetch, and how much of it the briefing covers.
forecast_days: 14
briefing_days: 7

# Alert trigger levels. Gusts mph, snow cm, precipitation mm, temperature C.
thresholds:
  gust_mph_moderate: 45.0
  gust_mph_high: 60.0
  snowfall_cm: 2.0
  precip_mm_daily: 20.0
  temp_anomaly_c: 6.0
  frost_probability_pct: 30.0
  snow_probability_pct: 20.0
  # Ensemble spread growing by more than this factor day-on-day is the
  # "uncertainty explosion" signal.
  spread_jump_factor: 2.0
  # Cross-model temperature range beyond this counts as real divergence.
  model_divergence_temp_c: 4.0

# Stratospheric polar vortex / sudden-stratospheric-warming watch.
# NOAA CPC publishes this only as GIFs, so Skywatch computes the zonal-mean
# zonal wind itself by sampling the 60N latitude circle at 10 hPa.
vortex:
  latitude: 60.0
  pressure_hpa: 10
  n_longitudes: 12              # Sample points around the latitude circle
  season_start_month: 11        # SSW is a winter phenomenon. Outside Nov-Mar,
  season_end_month: 3           # easterlies are normal and reported as such.
  reversal_ms: 0.0              # u below this = SSW underway
  weak_ms: 15.0                 # u below this = notably weak vortex

# Baseline for "what's normal for this date", from Open-Meteo's ERA5 archive.
climatology:
  start_year: 1991
  end_year: 2020
  window_days: 3                # +/- days around the target calendar date

# The `skywatch serve` HTTP server: dashboard + run history + latest alerts
# over the tailnet. host 'tailscale' auto-detects this machine's 100.x address
# (falls back to 127.0.0.1 if Tailscale is down); use 0.0.0.0 to expose on all
# interfaces, or set an explicit IP. See launchd/com.skywatch.serve.plist.example.
serve:
  host: tailscale
  port: 8092

# Push notifications for high-severity alerts (and lightning). The topic comes
# from SKYWATCH_NTFY_TOPIC in .env, which also switches this on.
ntfy:
  enabled: false
  server: https://ntfy.sh
  topic: null
  min_severity: high            # low | moderate | high | severe

# Real-time lightning watcher (`skywatch stormwatch`, its own launchd agent).
# Strikes from the Blitzortung community network. Alerts push via ntfy above:
# severe when lightning is inside alert_radius_miles, high when strikes inside
# approach_radius_miles are closing between ten-minute windows.
stormwatch:
  enabled: true
  alert_radius_miles: 5.0
  approach_radius_miles: 25.0
  monitor_radius_miles: 100.0

# Paths. Relative paths resolve against this config file's directory, not the
# working directory, so launchd can run the app from anywhere.
cache_dir: cache
output_dir: output
state_db: state.db
cache_ttl_minutes: 60           # Re-runs inside this window reuse cached responses
