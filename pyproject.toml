[project]
name = "skywatch"
version = "0.1.0"
description = "Local weather-watching and analysis system: physics models forecast, an LLM narrates."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Chris Cousins"}]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "openai>=1.40",
    "jinja2>=3.1",
    "websockets>=12.0",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/ChrisC-HeartInternet/SkyWatch"
Repository = "https://github.com/ChrisC-HeartInternet/SkyWatch"
Issues = "https://github.com/ChrisC-HeartInternet/SkyWatch/issues"

[project.scripts]
skywatch = "skywatch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skywatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src/skywatch"]
strict = true
warn_return_any = true
disallow_untyped_defs = true
